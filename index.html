<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PAH Block Puzzle</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header>
    <h1>PAH Block Puzzle<span class="subtitle" data-i18n="subtitle">Polycyclic Aromatic Block Puzzle</span></h1>
    <div class="scores hidden" id="scores">
      <div class="score-box"><span class="label" data-i18n="score">Score</span><span id="score">0</span></div>
      <div class="score-box"><span class="label"><span data-i18n="best">Best</span><span id="best-mode-tag"></span></span><span id="best-score">0</span></div>
      <div class="score-box hidden" id="level-box"><span class="label" data-i18n="level">Level</span><span id="level">1</span></div>
    </div>
  </header>

  <div id="home-screen">
    <svg id="home-hero" viewBox="0 0 400 180" xmlns="http://www.w3.org/2000/svg">
      <g stroke="#1d2126" stroke-width="1.5" stroke-opacity="0.55">
        <!-- Coronene flower, centerpiece -->
        <g fill="#f72585">
          <polygon points="226,85 213,107.5 187,107.5 174,85 187,62.5 213,62.5"/>
          <polygon points="265,107.5 252,130 226,130 213,107.5 226,85 252,85"/>
          <polygon points="265,62.5 252,85 226,85 213,62.5 226,40 252,40"/>
          <polygon points="226,40 213,62.5 187,62.5 174,40 187,17.5 213,17.5"/>
          <polygon points="187,62.5 174,85 148,85 135,62.5 148,40 174,40"/>
          <polygon points="187,107.5 174,130 148,130 135,107.5 148,85 174,85"/>
          <polygon points="226,130 213,152.5 187,152.5 174,130 187,107.5 213,107.5"/>
        </g>
        <g fill="none" stroke="rgba(255,255,255,0.75)" stroke-width="2">
          <circle cx="200" cy="85" r="11"/>
          <circle cx="239" cy="107.5" r="11"/>
          <circle cx="239" cy="62.5" r="11"/>
          <circle cx="200" cy="40" r="11"/>
          <circle cx="161" cy="62.5" r="11"/>
          <circle cx="161" cy="107.5" r="11"/>
          <circle cx="200" cy="130" r="11"/>
        </g>

        <!-- Pyrene, lower left -->
        <g fill="#90be6d">
          <polygon points="72,100 63.5,114.72 46.5,114.72 38,100 46.5,85.28 63.5,85.28"/>
          <polygon points="97.5,114.72 89,129.44 72,129.44 63.5,114.72 72,100 89,100"/>
          <polygon points="72,129.44 63.5,144.16 46.5,144.16 38,129.44 46.5,114.72 63.5,114.72"/>
          <polygon points="97.5,144.16 89,158.88 72,158.88 63.5,144.16 72,129.44 89,129.44"/>
        </g>
        <g fill="none" stroke="rgba(255,255,255,0.75)" stroke-width="1.6">
          <circle cx="55" cy="100" r="7.2"/>
          <circle cx="80.5" cy="114.72" r="7.2"/>
          <circle cx="55" cy="129.44" r="7.2"/>
          <circle cx="80.5" cy="144.16" r="7.2"/>
        </g>

        <!-- Anthracene, right -->
        <g fill="#f9c74f">
          <polygon points="325,95 317.5,107.99 302.5,107.99 295,95 302.5,82.01 317.5,82.01"/>
          <polygon points="347.5,107.99 340,120.98 325,120.98 317.5,107.99 325,95 340,95"/>
          <polygon points="370,120.98 362.5,133.97 347.5,133.97 340,120.98 347.5,107.99 362.5,107.99"/>
        </g>
        <g fill="none" stroke="rgba(255,255,255,0.75)" stroke-width="1.4">
          <circle cx="310" cy="95" r="6.3"/>
          <circle cx="332.5" cy="107.99" r="6.3"/>
          <circle cx="355" cy="120.98" r="6.3"/>
        </g>

        <!-- floating benzene accents -->
        <g fill="#e63946">
          <polygon points="40,45 35,53.66 25,53.66 20,45 25,36.34 35,36.34"/>
        </g>
        <circle cx="30" cy="45" r="4.2" fill="none" stroke="rgba(255,255,255,0.75)" stroke-width="1.2"/>
        <g fill="#f3722c">
          <polygon points="375,155 370,163.66 360,163.66 355,155 360,146.34 370,146.34"/>
        </g>
        <circle cx="365" cy="155" r="4.2" fill="none" stroke="rgba(255,255,255,0.75)" stroke-width="1.2"/>
        <g fill="#43aa8b">
          <polygon points="145,160 140,168.66 130,168.66 125,160 130,151.34 140,151.34"/>
        </g>
        <circle cx="135" cy="160" r="4.2" fill="none" stroke="rgba(255,255,255,0.75)" stroke-width="1.2"/>
      </g>
    </svg>

    <div id="lang-selector"></div>

    <p class="home-tagline" data-i18n="home.tagline">Fused-ring molecules, hex by hex. Pick a way to play.</p>
    <div class="home-cards">
      <button class="home-card" id="home-fall-btn">
        <span class="home-card-icon">⬡</span>
        <h2 data-i18n="home.fallingTitle">Falling</h2>
        <p data-i18n="home.fallingDesc">Molecules fall like Tetris — steer, rotate, and clear full rows before they stack up.</p>
        <p class="home-card-best"><span data-i18n="best">Best</span> <span id="home-fall-best">0</span></p>
      </button>
      <button class="home-card" id="home-place-btn">
        <span class="home-card-icon">⬢</span>
        <h2 data-i18n="home.placingTitle">Placing</h2>
        <p data-i18n="home.placingDesc">No rush — pick a molecule from the tray and fit it onto the board anywhere it goes.</p>
        <p class="home-card-best"><span data-i18n="best">Best</span> <span id="home-place-best">0</span></p>
      </button>
    </div>
  </div>

  <div id="orientation-screen" class="hidden">
    <p class="home-tagline" data-i18n="orientation.tagline">Which way should the hexagons point?</p>
    <div class="difficulty-cards">
      <button class="difficulty-card" data-orientation="flat">
        <span class="home-card-icon icon-rotated-hex">⬡</span>
        <h2 data-i18n="orientation.flatTitle">Flat-top</h2>
        <p data-i18n="orientation.flatDesc">Falls in a perfectly straight column; side-to-side moves drift slightly.</p>
      </button>
      <button class="difficulty-card" data-orientation="pointy">
        <span class="home-card-icon">⬡</span>
        <h2 data-i18n="orientation.pointyTitle">Pointy-top</h2>
        <p data-i18n="orientation.pointyDesc">Side-to-side moves are perfectly straight; the fall drifts slightly.</p>
      </button>
    </div>
    <button id="orientation-back-btn" class="text-back-btn">← <span data-i18n="back">Back</span></button>
  </div>

  <div id="difficulty-screen" class="hidden">
    <p class="home-tagline" data-i18n="difficulty.tagline">How complex should the molecules get?</p>
    <div class="difficulty-cards">
      <button class="difficulty-card" data-factor="0.55" data-difficulty="easy">
        <h2 data-i18n="difficulty.easyTitle">Easy</h2>
        <p data-i18n="difficulty.easyDesc">Mostly benzene and naphthalene, a few bigger ones.</p>
      </button>
      <button class="difficulty-card" data-factor="1" data-difficulty="normal">
        <h2 data-i18n="difficulty.normalTitle">Normal</h2>
        <p data-i18n="difficulty.normalDesc">A balanced mix across the whole set.</p>
      </button>
      <button class="difficulty-card" data-factor="1.6" data-difficulty="hard">
        <h2 data-i18n="difficulty.hardTitle">Hard</h2>
        <p data-i18n="difficulty.hardDesc">Bigger fused rings show up often.</p>
      </button>
      <button class="difficulty-card" data-factor="2.3" data-difficulty="expert">
        <h2 data-i18n="difficulty.expertTitle">Expert</h2>
        <p data-i18n="difficulty.expertDesc">Coronene and friends, frequently.</p>
      </button>
    </div>
    <button id="difficulty-back-btn" class="text-back-btn">← <span data-i18n="back">Back</span></button>
  </div>

  <div id="game-screen" class="hidden">
    <div id="mode-toggle" role="tablist">
      <button id="home-btn" data-i18n-aria="game.home" aria-label="Home">🏠</button>
      <button id="pause-btn" data-i18n="game.pause">Pause</button>
    </div>

    <div class="play-area">
      <div class="board-wrap">
        <canvas id="board-canvas"></canvas>
      </div>
      <aside id="side-panel">
        <div id="fall-panel">
          <div class="panel-block">
            <h2 data-i18n="game.next">Next</h2>
            <canvas id="next-canvas"></canvas>
            <div id="next-label" class="molecule-label"></div>
          </div>
          <div class="panel-block">
            <h2 data-i18n="game.fallingLabel">Falling</h2>
            <div id="current-label" class="molecule-label"></div>
          </div>
        </div>
        <div id="place-panel" class="hidden"></div>
        <button id="new-game-btn" data-i18n="game.newGame">New Game</button>
      </aside>
    </div>

    <div id="touch-controls">
      <button id="btn-left" data-i18n-aria="controls.left" aria-label="Left">◀</button>
      <button id="btn-rotate" data-i18n-aria="controls.rotate" aria-label="Rotate">↻</button>
      <button id="btn-right" data-i18n-aria="controls.right" aria-label="Right">▶</button>
      <button id="btn-down" data-i18n-aria="controls.softDrop" aria-label="Soft drop">▼</button>
      <button id="btn-drop" data-i18n-aria="controls.hardDrop" aria-label="Hard drop">⤓</button>
    </div>
  </div>

  <div id="game-over-overlay" class="hidden">
    <div class="game-over-card">
      <h2 data-i18n="gameOver.title">Game Over</h2>
      <p data-i18n="gameOver.finalScore">Final score</p>
      <p id="final-score">0</p>
      <p id="run-summary"></p>
      <p id="game-over-best"></p>
      <p id="new-best" class="hidden" data-i18n="gameOver.newBest">New best score!</p>
      <button id="share-native-btn" class="hidden" data-i18n="share.button">Share</button>
      <div id="share-row">
        <a id="share-x-btn" class="share-btn share-x" href="#" target="_blank" rel="noopener noreferrer">X</a>
        <button id="share-instagram-btn" class="share-btn share-instagram">Instagram</button>
        <a id="share-line-btn" class="share-btn share-line" href="#" target="_blank" rel="noopener noreferrer">LINE</a>
        <button id="share-copy-btn" class="share-btn share-copy" data-i18n="share.copyLink">Copy link</button>
      </div>
      <p id="share-copied-note" class="hidden" data-i18n="share.copied">Copied!</p>
      <button id="restart-btn" data-i18n="game.newGame">New Game</button>
    </div>
  </div>

  <div id="paused-overlay" class="hidden">
    <div class="game-over-card">
      <h2 data-i18n="paused.title">Paused</h2>
      <button id="resume-btn" data-i18n="game.resume">Resume</button>
    </div>
  </div>
</div>

<script src="i18n.js"></script>
<script src="hexmath.js"></script>
<script src="pieces.js"></script>
<script src="board.js"></script>
<script src="game.js"></script>
</body>
</html>
