<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PAH Block Puzzle</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header>
    <h1>PAH Block Puzzle<span class="subtitle">多環芳香族ブロックパズル</span></h1>
    <div class="scores">
      <div class="score-box"><span class="label">Score</span><span id="score">0</span></div>
      <div class="score-box"><span class="label">Best</span><span id="best-score">0</span></div>
      <div class="score-box" id="level-box"><span class="label">Level</span><span id="level">1</span></div>
    </div>
  </header>

  <div id="home-screen">
    <p class="home-tagline">Fused-ring molecules, hex by hex. Pick a way to play.</p>
    <div class="home-cards">
      <button class="home-card" id="home-fall-btn">
        <span class="home-card-icon">⬡</span>
        <h2>Falling</h2>
        <p>Molecules fall like Tetris — steer, rotate, and clear full rows before they stack up.</p>
      </button>
      <button class="home-card" id="home-place-btn">
        <span class="home-card-icon">⬢</span>
        <h2>Placing</h2>
        <p>No rush — pick a molecule from the tray and fit it onto the board anywhere it goes.</p>
      </button>
    </div>
  </div>

  <div id="orientation-screen" class="hidden">
    <p class="home-tagline">Which way should the hexagons point?</p>
    <div class="difficulty-cards">
      <button class="difficulty-card" data-orientation="flat">
        <span class="home-card-icon icon-rotated-hex">⬡</span>
        <h2>Flat-top</h2>
        <p>Falls in a perfectly straight column; side-to-side moves drift slightly.</p>
      </button>
      <button class="difficulty-card" data-orientation="pointy">
        <span class="home-card-icon">⬡</span>
        <h2>Pointy-top</h2>
        <p>Side-to-side moves are perfectly straight; the fall drifts slightly.</p>
      </button>
    </div>
    <button id="orientation-back-btn" class="text-back-btn">← Back</button>
  </div>

  <div id="difficulty-screen" class="hidden">
    <p class="home-tagline">How complex should the molecules get?</p>
    <div class="difficulty-cards">
      <button class="difficulty-card" data-factor="0.55">
        <h2>Easy</h2>
        <p>Mostly benzene and naphthalene, a few bigger ones.</p>
      </button>
      <button class="difficulty-card" data-factor="1">
        <h2>Normal</h2>
        <p>A balanced mix across the whole set.</p>
      </button>
      <button class="difficulty-card" data-factor="1.6">
        <h2>Hard</h2>
        <p>Bigger fused rings show up often.</p>
      </button>
      <button class="difficulty-card" data-factor="2.3">
        <h2>Expert</h2>
        <p>Coronene and friends, frequently.</p>
      </button>
    </div>
    <button id="difficulty-back-btn" class="text-back-btn">← Back</button>
  </div>

  <div id="game-screen" class="hidden">
    <div id="mode-toggle" role="tablist">
      <button id="home-btn" aria-label="Home">🏠</button>
      <button id="pause-btn">Pause</button>
    </div>

    <div class="play-area">
      <div class="board-wrap">
        <canvas id="board-canvas"></canvas>
      </div>
      <aside id="side-panel">
        <div id="fall-panel">
          <div class="panel-block">
            <h2>Next</h2>
            <canvas id="next-canvas"></canvas>
            <div id="next-label" class="molecule-label"></div>
          </div>
          <div class="panel-block">
            <h2>Falling</h2>
            <div id="current-label" class="molecule-label"></div>
          </div>
        </div>
        <div id="place-panel" class="hidden"></div>
        <button id="new-game-btn">New Game</button>
      </aside>
    </div>

    <div id="touch-controls">
      <button id="btn-left" aria-label="Left">◀</button>
      <button id="btn-rotate" aria-label="Rotate">↻</button>
      <button id="btn-right" aria-label="Right">▶</button>
      <button id="btn-down" aria-label="Soft drop">▼</button>
      <button id="btn-drop" aria-label="Hard drop">⤓</button>
    </div>
  </div>

  <div id="game-over-overlay" class="hidden">
    <div class="game-over-card">
      <h2>Game Over</h2>
      <p>Final score</p>
      <p id="final-score">0</p>
      <p id="new-best" class="hidden">New best score!</p>
      <button id="restart-btn">New Game</button>
    </div>
  </div>

  <div id="paused-overlay" class="hidden">
    <div class="game-over-card">
      <h2>Paused</h2>
      <button id="resume-btn">Resume</button>
    </div>
  </div>
</div>

<script src="hexmath.js"></script>
<script src="pieces.js"></script>
<script src="board.js"></script>
<script src="game.js"></script>
</body>
</html>
